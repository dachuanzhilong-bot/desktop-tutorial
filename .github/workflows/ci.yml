name: CI
# One run per change: pull requests, and pushes to main (a push to a PR branch is checked by its pull_request run).
# Changes to Markdown only (docs, plans) run nothing. A newer push cancels the older run of the same ref.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solver:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: solver } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      # the browser solver (Solve screen) must keep compiling to WebAssembly
      - run: cargo build --release --lib --target wasm32-unknown-unknown

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # the export must also work under a sub-path (GitHub Pages project site)
      - run: npm run e2e:subpath
