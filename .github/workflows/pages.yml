# Publishes the app as a GitHub Pages project site: https://<owner>.github.io/<repo>/
# One-time setup in the repository: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Runs on every push to main, and by hand (Actions -> Pages -> Run workflow).
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # builds the export for /<repo>/ and checks that very build in a browser (data, both workers, offline);
      # what gets published below is the folder that was just tested
      - run: npm run e2e:subpath
        env:
          E2E_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/out }
      - id: deployment
        uses: actions/deploy-pages@v4
